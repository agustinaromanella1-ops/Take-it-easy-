<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tu agenda, pipi cucu. Pacientes, sesiones y honorarios para consultorio psicologico." />
    <meta name="theme-color" content="#d9ebfb" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" />
    <!-- iOS no lee el manifest: necesita sus propias etiquetas para
         instalarse en la pantalla de inicio y abrirse sin barra del navegador. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Las tipografías se piden desde el HTML y no al llegar al CSS: si no,
         el primer dibujado sale con la fuente de respaldo del sistema (Times)
         y un instante después salta a la buena. Ese salto se ve como si el
         nombre de la app estuviera mal dibujado. crossorigin es obligatorio
         en el precargado de fuentes aunque el archivo sea del mismo sitio. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/playfair-display-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/nunito-latin.woff2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pipí Cucú" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pipí Cucú — tu agenda, pipí cucú</title>
  </head>
  <body>
    <!-- El tema se pinta antes de que cargue el JavaScript de la app: si
         esperara, la pantalla arrancaría en claro y saltaría a oscuro de
         golpe. Son tres líneas y evitan el flash. -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('pipicucu:tema');
          var oscuro = g === 'oscuro' || (g !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
          document.querySelector('meta[name="theme-color"]').content = oscuro ? '#1a1533' : '#d9ebfb';
          var a = localStorage.getItem('pipicucu:animaciones');
          document.documentElement.dataset.animaciones = a === 'siempre' || a === 'nunca' ? a : 'auto';
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
