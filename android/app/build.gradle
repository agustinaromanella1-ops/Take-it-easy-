apply plugin: 'com.android.application'

/**
 * La clave con la que se firma lo que se sube a Play llega por el entorno y
 * nunca por un archivo del repositorio: el .keystore lo escribe quien compila,
 * y se borra al terminar.
 */
def hayClaveDeSubida = System.getenv('CLAVE_DE_SUBIDA') != null

android {
    namespace = "ar.takeiteasy.agenda"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ar.takeiteasy.agenda"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play exige que este número suba en cada entrega y no deja repetirlo
        // ni bajarlo nunca. Lo pone quien compila para publicar; para las
        // pruebas de mano da igual y queda en 1.
        versionCode System.getenv('VERSION_CODE') ? System.getenv('VERSION_CODE').toInteger() : 1
        versionName System.getenv('VERSION_NOMBRE') ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La firma del APK tiene que ser siempre la misma: si cambia, Android
    // trata cada compilación como una app distinta, se niega a instalarla
    // encima de la anterior y obliga a desinstalar, lo que borra todos los
    // datos del teléfono. Por eso esta clave está en el repositorio a
    // propósito. No es la clave de Play Store: ésa se genera aparte, nunca
    // se versiona, y si se filtra no hay forma de recuperarla.
    signingConfigs {
        debug {
            storeFile file('prueba.keystore')
            storePassword 'apk-de-prueba'
            keyAlias 'prueba'
            keyPassword 'apk-de-prueba'
        }
        release {
            if (hayClaveDeSubida) {
                storeFile file(System.getenv('CLAVE_DE_SUBIDA'))
                storePassword System.getenv('CLAVE_DE_SUBIDA_ALMACEN')
                keyAlias System.getenv('CLAVE_DE_SUBIDA_ALIAS')
                keyPassword System.getenv('CLAVE_DE_SUBIDA_CLAVE')
            }
        }
    }
    buildTypes {
        release {
            // La clave de subida a Play llega por el entorno y nunca por un
            // archivo del repositorio. Si no está, el release sale sin firmar
            // y Play lo rechaza: es mejor que se caiga ahí, a la vista, que
            // firmarlo en silencio con la clave de prueba, que es pública.
            if (hayClaveDeSubida) {
                signingConfig signingConfigs.release
            }
            // Sin R8: Capacitor y sus plugins se buscan por reflexión y
            // ofuscarlos rompe cosas que sólo se ven en el teléfono. La app
            // pesa cuatro megas; no hay nada que ahorrar que valga ese riesgo.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
