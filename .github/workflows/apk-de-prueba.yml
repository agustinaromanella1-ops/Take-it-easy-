name: APK de prueba

# Compila la app y la deja publicada como archivo descargable, para poder
# instalarla en un teléfono sin tener Android Studio ni un cable.

on:
  push:
    branches: [claude/take-it-easy-spec-orx7xd]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Revisar que esté todo en orden antes de compilar
        run: |
          npm run lint
          npx tsc -b
          npx vitest run

      - name: Armar la web app
        run: npm run build

      - name: Pasarla al proyecto Android
        run: npx cap sync android

      # Capacitor 8 con compileSdk 36 necesita JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle firma el APK de prueba con una clave que genera al vuelo. En un
      # runner nuevo esa clave es distinta cada vez, y Android ve cada
      # compilación como una app ajena: al instalarla encima avisa "conflicto
      # con un paquete" y obliga a desinstalar, lo que borra todos los datos
      # del teléfono. Por eso la clave se genera una sola vez y se reusa.
      #
      # No se versiona: se guarda entre compilaciones y el repositorio la
      # ignora. No es la clave de Play Store, que se genera aparte.
      - name: Reusar la clave de firma de siempre
        uses: actions/cache@v4
        with:
          path: android/app/prueba.keystore
          key: clave-de-firma-de-prueba

      - name: Crear la clave la primera vez
        run: |
          if [ ! -f android/app/prueba.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore android/app/prueba.keystore \
              -alias prueba -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CLAVE" -keypass "$CLAVE" \
              -dname "CN=Take It Easy (APK de prueba), O=Take It Easy, C=AR"
          fi
          test -f android/app/prueba.keystore
        env:
          CLAVE: apk-de-prueba

      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Ponerle un nombre reconocible
        run: cp android/app/build/outputs/apk/debug/app-debug.apk take-it-easy.apk

      # Una publicación con etiqueta fija: el enlace siempre es el mismo y se
      # puede guardar en favoritos del teléfono.
      - name: Publicar para descargar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-de-prueba >/dev/null 2>&1; then
            gh release upload apk-de-prueba take-it-easy.apk --clobber
          else
            gh release create apk-de-prueba take-it-easy.apk \
              --prerelease \
              --title "APK de prueba" \
              --notes "Versión para probar en el teléfono. Se reemplaza con cada cambio."
          fi
