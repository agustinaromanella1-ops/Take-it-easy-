name: AAB para Play

# Arma el archivo firmado que se sube a Google Play. No corre solo: se lanza
# a mano desde la pestaña Actions, porque cada corrida gasta un número de
# versión que Play no deja repetir ni bajar nunca.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Número de versión para Play. Vacío usa el número de corrida.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Antes de tocar nada: si falta la clave, el build de release sale sin
      # firmar y Play lo rechaza recién al subirlo. Mejor que se caiga acá,
      # con el motivo escrito.
      - name: Revisar que esté la clave de subida
        env:
          CLAVE: ${{ secrets.CLAVE_DE_SUBIDA_BASE64 }}
          ALMACEN: ${{ secrets.CLAVE_DE_SUBIDA_ALMACEN }}
          ALIAS: ${{ secrets.CLAVE_DE_SUBIDA_ALIAS }}
          CLAVE_DE_LA_CLAVE: ${{ secrets.CLAVE_DE_SUBIDA_CLAVE }}
        run: |
          faltan=""
          [ -n "$CLAVE" ] || faltan="$faltan CLAVE_DE_SUBIDA_BASE64"
          [ -n "$ALMACEN" ] || faltan="$faltan CLAVE_DE_SUBIDA_ALMACEN"
          [ -n "$ALIAS" ] || faltan="$faltan CLAVE_DE_SUBIDA_ALIAS"
          [ -n "$CLAVE_DE_LA_CLAVE" ] || faltan="$faltan CLAVE_DE_SUBIDA_CLAVE"
          if [ -n "$faltan" ]; then
            echo "Faltan estos secretos del repositorio:$faltan"
            echo "Se cargan en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Revisar que esté todo en orden antes de compilar
        run: |
          npm run lint
          npx tsc -b
          npx vitest run

      - name: Armar la web app
        run: npm run build

      - name: Pasarla al proyecto Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El archivo se escribe fuera del repositorio, para que no haya forma de
      # que termine en un commit ni en los artefactos de la corrida.
      - name: Escribir la clave
        env:
          CLAVE: ${{ secrets.CLAVE_DE_SUBIDA_BASE64 }}
        run: |
          echo "$CLAVE" | base64 -d > "$RUNNER_TEMP/subida.keystore"
          test -s "$RUNNER_TEMP/subida.keystore"

      - name: Compilar el AAB firmado
        working-directory: android
        env:
          CLAVE_DE_SUBIDA: ${{ runner.temp }}/subida.keystore
          CLAVE_DE_SUBIDA_ALMACEN: ${{ secrets.CLAVE_DE_SUBIDA_ALMACEN }}
          CLAVE_DE_SUBIDA_ALIAS: ${{ secrets.CLAVE_DE_SUBIDA_ALIAS }}
          CLAVE_DE_SUBIDA_CLAVE: ${{ secrets.CLAVE_DE_SUBIDA_CLAVE }}
          # El nombre que ve la gente sale de package.json, que es donde vive
          # la versión; el número que ordena las entregas, de la corrida.
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: |
          export VERSION_NOMBRE="$(node -p "require('../package.json').version")"
          echo "Versión $VERSION_NOMBRE, entrega $VERSION_CODE"
          ./gradlew bundleRelease --no-daemon

      # Que el AAB esté firmado no se da por sentado: si la firma no entró,
      # el archivo no tiene META-INF y Play lo rechaza al subirlo.
      - name: Revisar que haya quedado firmado
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          if ! unzip -l "$aab" | grep -q 'META-INF/.*\.\(RSA\|EC\|DSA\)'; then
            echo "El AAB salió sin firmar."
            exit 1
          fi
          echo "Firmado."

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/subida.keystore"

      # Artefacto de la corrida y no una publicación: sólo lo baja quien entra
      # al repositorio, desde la página de esta corrida.
      - name: Dejarlo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: take-it-easy-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
