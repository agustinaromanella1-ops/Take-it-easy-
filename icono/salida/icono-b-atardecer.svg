<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddf2ec"/>
      <stop offset="0.5" stop-color="#f1ecf9"/>
      <stop offset="1" stop-color="#fff0e6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#cielo)"/>
  <g transform="translate(512 512) scale(1) translate(-22 5)">
    <g transform="translate(0 -30)">
      <circle cx="0" cy="0" r="300" fill="#123f3c"/>
      <!-- La colita: sale a las cuatro y media y baja hacia afuera. -->
      <path d="M 256 156 Q 334 238 344 350 Q 248 312 150 260 Z" fill="#123f3c"/>
    </g>
    <g stroke-linecap="round" fill="none">
      <!-- Minutero a las 12 y horario a las 9: las nueve en punto. -->
      <line x1="0" y1="-30" x2="0" y2="-206" stroke="#ff9c80" stroke-width="46"/>
      <line x1="0" y1="-30" x2="-176" y2="-30" stroke="#fdf9f2" stroke-width="46"/>
    </g>
    <circle cx="0" cy="-30" r="32" fill="#fdf9f2"/>
  </g>
</svg>