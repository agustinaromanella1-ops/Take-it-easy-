[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# La app es de una sola página: cualquier ruta la resuelve el index.
# Sin esto, recargar dentro de la app daría 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Los archivos con hash en el nombre nunca cambian de contenido: se pueden
# cachear para siempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker y el index NO se cachean: son los que avisan que hay
# una versión nueva. Si el navegador los guarda, la app queda congelada en
# la versión vieja aunque se publique una nueva.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
